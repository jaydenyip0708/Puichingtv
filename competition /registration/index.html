<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>6/27學年 第七屆紅藍舞台報名表</title>
  <style>
    body { margin: 0; background: #fff; color: #111; font-family: "PingFang HK", "Microsoft JhengHei", Arial, sans-serif; font-size: 16px; line-height: 1.6; }
    .wrap { max-width: 680px; margin: 0 auto; padding: 24px 16px 40px; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    .info { margin: 0 0 16px; }
    .rule { border: 1px solid #111; padding: 10px 12px; margin: 12px 0 20px; font-weight: 700; }
    form { border-top: 1px solid #ddd; padding-top: 8px; }
    label.field { display: block; font-weight: 700; margin: 18px 0 6px; }
    .req { color: #c00; }
    .hint { font-weight: 400; color: #555; font-size: 13px; }
    input[type="text"], input[type="email"], input[type="tel"], textarea {
      width: 100%; border: none; border-bottom: 1px solid #bbb; padding: 8px 2px; font-size: 16px; font-family: inherit; background: transparent;
    }
    textarea { min-height: 72px; border: 1px solid #ddd; padding: 8px; }
    .checks { margin-top: 6px; }
    .check { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
    .check input { width: 18px; height: 18px; }
    .other { display: flex; align-items: center; gap: 8px; }
    .other input[type="text"] { flex: 1; }
    #loginGate { margin: 24px 0; }
    #googleLogin {
      width: 100%; border: none; background: #f3f4f8; color: #3c4043;
      border-radius: 999px; padding: 14px 18px; font-size: 16px; font-weight: 500;
      display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
    }
    #form { display: none; }
    #submitBtn { margin-top: 22px; background: #111; color: #fff; border: none; padding: 10px 18px; font-size: 16px; }
    button:disabled { opacity: .5; }
    .msg { margin-top: 12px; display: none; }
    .msg.ok { display: block; color: #065f46; }
    .msg.err { display: block; color: #991b1b; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>6/27學年 第七屆紅藍舞台報名表</h1>
    <p class="info">
      歡迎大家參加第八屆紅藍舞台～<br>
      日期：1月25日（星期一）<br>
      時間：17:30<br>
      地點：H8禮堂<br>
      活動對象：兩校部師生，校友<br><br>
      表現形式及題材不限！請大家盡情發揮你嘅創意 展現你獨特的腦迴路<br>
      只有你諗唔到 冇我地做唔到<br>
      歡迎校友/032/188既紅藍兒女報名，無論係個人或組隊都冇問題<br>
      歡迎大家積極參與 期待見到你哋
    </p>
    <div class="rule">不過要留意，今年每人只能參加最多兩組組別（不限個人或團隊）</div>
    <p>這份表單會收集所有作答者的電子郵件地址。請先用 @g.puiching.edu.mo 登入。</p>

    <div id="loginGate">
      <button type="button" id="googleLogin" onclick="doGoogleLogin()">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.2-3.5 5.7-6.6 7.1l6.3 5.3C37.4 38.3 44 34 44 24c0-1.2-.1-2.3-.4-3.5z"/></svg>
        Log in with Google
      </button>
      <div id="loginEmail" class="hint"></div>
    </div>

    <form id="form">
      <label class="field">組長姓名 <span class="req">*</span></label>
      <input type="text" name="leaderName" required>

      <label class="field">組長班別或級社 <span class="req">*</span><br><span class="hint">例：S6A/恩社（校友填寫級社／在讀同學填班級）</span></label>
      <input type="text" name="leaderClass" required>

      <label class="field">組長聯絡電話 <span class="req">*</span></label>
      <input type="tel" name="phone" required>

      <label class="field">組長WeChat id <span class="req">*</span></label>
      <input type="text" name="wechat" required>

      <label class="field">組員姓名及班別 <span class="req">*</span><br><span class="hint">例：XXX XXX S6A, XXX S6C。個人參賽可填「個人」</span></label>
      <textarea name="members" required></textarea>

      <label class="field">表演內容 <span class="req">*</span></label>
      <div class="checks">
        <label class="check"><input type="checkbox" name="performance" value="唱歌"> 唱歌</label>
        <label class="check"><input type="checkbox" name="performance" value="跳舞"> 跳舞</label>
        <label class="check"><input type="checkbox" name="performance" value="變魔術"> 變魔術</label>
        <label class="check"><input type="checkbox" name="performance" value="寵物表演"> 寵物表演</label>
        <label class="check"><input type="checkbox" name="performance" value="廚藝表演"> 廚藝表演</label>
        <label class="check"><input type="checkbox" name="performance" value="樂器表演"> 樂器表演</label>
        <label class="check other"><input type="checkbox" name="performance" value="其他" id="otherCheck"> 其他：<input type="text" id="otherText" placeholder="請填寫"></label>
      </div>

      <input type="hidden" name="email" id="email">

      <button type="submit" id="submitBtn">提交</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    var APPS_SCRIPT_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnQ5eKkLBAkdRsG_JApzh5OMHV7oJ-Pym7_EK1_avs7nktrjbsgrwzAGTULQPIaFYyWS-CNcQOfVt50ouMdAeKPkND6QDvcqp0X0TPZKKjA-SVrnV2yNrfOziZD5mIc2EEUAChesSKivx5wLG00xRSO6Lchelp5pAfp4x_2MY1ctjWaw_mNDn2UpVd0fxslrd-etIF4gI0qQAKy31ndhbVORXlrNMoJVUwsCp4yp2H97Gk9en9P-ijTty9G8CEUbV8gyNkVEtNAdwpjKvSk&lib=Ma8skTlWbxSkkMX5EUG9X_MImOQyPd-9o";
    var GOOGLE_CLIENT_ID = "842172643393-rgaomajla5lpv6013m2rrk3taurvc5c6.apps.googleusercontent.com";
    var googleAuthClient = null;
    var loggedEmail = "";

    function doGoogleLogin() {
      if (!window.google || !google.accounts || !google.accounts.oauth2) {
        show("Google 服務尚未載入，請重新整理", true);
        return;
      }
      if (!googleAuthClient) {
        googleAuthClient = google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_CLIENT_ID,
          scope: "openid email profile",
          callback: function(tokenResponse) {
            if (!tokenResponse || tokenResponse.error || !tokenResponse.access_token) {
              show("登入已取消", true);
              return;
            }
            fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
              headers: { Authorization: "Bearer " + tokenResponse.access_token }
            }).then(function(r) { return r.json(); }).then(function(info) {
              var email = (info.email || "").trim().toLowerCase();
              if (!email.endsWith("@g.puiching.edu.mo")) {
                loggedEmail = "";
                document.getElementById("email").value = "";
                document.getElementById("loginEmail").innerText = "";
                show("沒有權限", true);
                return;
              }
              loggedEmail = email;
              document.getElementById("email").value = email;
              document.getElementById("loginEmail").innerText = "已登入：" + email;
              document.getElementById("form").style.display = "block";
              document.getElementById("googleLogin").style.display = "none";
              show("", false);
            }).catch(function() {
              show("無法取得帳號資料", true);
            });
          }
        });
      }
      googleAuthClient.requestAccessToken({ prompt: "select_account" });
    }


    document.getElementById("form").addEventListener("submit", function(e) {
      e.preventDefault();
      var form = e.target;
      var checked = Array.from(form.querySelectorAll('input[name="performance"]:checked')).map(function(el) { return el.value; });
      var other = document.getElementById("otherText").value.trim();
      if (!checked.length) {
        show("請選擇表演內容", true);
        return;
      }
      if (checked.indexOf("其他") !== -1 && !other) {
        show("選擇「其他」請填寫內容", true);
        return;
      }
      var performance = checked.map(function(item) {
        return item === "其他" ? "其他：" + other : item;
      }).join("、");

      var email = loggedEmail || document.getElementById("email").value.trim().toLowerCase();
      if (!email || !email.endsWith("@g.puiching.edu.mo")) {
        show("沒有權限", true);
        return;
      }
      var data = {
        leaderName: form.leaderName.value.trim(),
        leaderClass: form.leaderClass.value.trim(),
        phone: form.phone.value.trim(),
        wechat: form.wechat.value.trim(),
        members: form.members.value.trim(),
        performance: performance,
        email: email
      };

      var btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerText = "提交中...";
      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "submitRegistration", payload: data })
      }).then(function(r) { return r.json(); }).then(function(res) {
        btn.disabled = false;
        btn.innerText = "提交";
        show((res && res.message) || "提交失敗", !(res && res.success));
        if (res && res.success) form.reset();
      }).catch(function(err) {
        btn.disabled = false;
        btn.innerText = "提交";
        show("提交失敗：" + err, true);
      });
    });

    function show(text, isError) {
      var msg = document.getElementById("msg");
      msg.className = "msg " + (isError ? "err" : "ok");
      msg.innerText = text;
    }
  </script>
</body>
</html>
